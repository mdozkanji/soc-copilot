[project]
name = "soc-copilot"
version = "0.1.0"
description = "AI-powered SOC alert triage & investigation copilot"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "networkx>=3.2",
    "scikit-learn>=1.4",
    "chromadb>=0.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
embeddings = [
    # Only needed for ChromaRetriever's real embedding backend
    # (rag/chroma_retriever.py). Kept out of the base install since
    # sentence-transformers downloads model weights from huggingface.co on
    # first use -- fine on your machine, not reachable from the sandbox
    # this project was built in. Install with: pip install -e ".[embeddings]"
    "sentence-transformers>=3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
